
<input id="inputbox" onkeypress="update()">
<h1 id="result"></h1>

<script>
    
    var inputbox = document.getElementById("inputbox");
    var result = document.getElementById("result");

    function update() {
        result.textContent = inputbox.value;
    }
</script>
